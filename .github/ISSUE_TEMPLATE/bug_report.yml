name: Relatar um bug
description: Informe um comportamento reproduzível do site.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes: { label: Descrição, description: Explique o problema. }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Passos para reproduzir, placeholder: "1. Acesse…\n2. Clique…\n3. Observe…" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Resultado esperado }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Resultado atual }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Ambiente, placeholder: "produção, preview ou local" }
  - type: input
    id: browser
    attributes: { label: Navegador, placeholder: "Chrome 130 / Windows 11" }
  - type: dropdown
    id: severity
    attributes: { label: Severidade, options: [baixa, média, alta, crítica] }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Capturas e logs, description: Remova tokens, dados pessoais e spoilers antes de anexar. }
