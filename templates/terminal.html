<!doctype html><html data-clean-route-alias lang="pt-BR"><head><script>if(/\.html$/i.test(location.pathname))location.replace('/templates/terminal'+location.search+location.hash)</script><base href="./"><link rel="canonical" href="https://sanctumveritatis.com/templates/terminal"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Modelo de terminal — Sanctum Veritatis</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/terminals.css"><link rel="stylesheet" href="../css/accessibility.css"></head><body class="terminal-page"><main class="terminal-frame"><header class="terminal-top"><span>SV-NET // TERMINAL ISOLADO 04</span><span>ENLACE: PARCIAL · NÍVEL 2</span></header><section id="terminal-output" class="terminal-output" aria-live="polite"><p>SANCTUM VERITATIS // ROTINA DE CONSULTA</p><p>Memória verificada: 93.7%</p><p class="terminal-warning">AVISO: o nó Setentrional respondeu fora da janela prevista.</p><p>Digite AJUDA para comandos disponíveis.</p></section><form id="terminal-form" class="terminal-prompt"><span>&gt;</span><label class="visually-hidden" for="command">Comando</label><input id="command" autocomplete="off" autofocus></form></main><script>const output=document.querySelector('#terminal-output'),form=document.querySelector('#terminal-form'),input=document.querySelector('#command');const commands={AJUDA:'COMANDOS: STATUS · SETENTRIONAL · LIMPAR',STATUS:'REDE 93.7% / MEMBRANA NORTE 78.4% / SESSÃO ATIVA',SETENTRIONAL:'STN-01: COMUNICAÇÃO INTERROMPIDA. Consulte o dossiê autorizado.'};form.addEventListener('submit',e=>{e.preventDefault();const cmd=input.value.trim().toUpperCase();if(cmd==='LIMPAR')output.innerHTML='';else output.insertAdjacentHTML('beforeend',`<p>&gt; ${cmd}</p><p class="${commands[cmd]?'':'terminal-error'}">${commands[cmd]||'COMANDO NÃO RECONHECIDO'}</p>`);input.value='';output.scrollTop=output.scrollHeight});</script></body></html>
