<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SETOR 967 // NULL</title>
  <meta name="robots" content="noindex,nofollow"/>
  
  <!-- Fontes -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Share+Tech+Mono&family=Inter:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --void: #030304;
      --obsidian: #0a0a0e;
      --glass: rgba(10, 10, 14, 0.65);
      --text-main: #e0e0e0;
      --text-dim: #5c5c66;
      --gold: #d8b46a;
      --gold-dim: rgba(216, 180, 106, 0.15);
      --crimson: #8a1c2f;
      --crimson-glow: rgba(138, 28, 47, 0.4);
      --violet: #8f6eff;
      --terminal-font: 'Share Tech Mono', monospace;
      --header-font: 'Cinzel', serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--void);
      background-image: 
        radial-gradient(circle at 50% 0%, #1a1a24 0%, transparent 60%),
        linear-gradient(to bottom, #000 0%, #050508 100%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* === EFEITOS DE TELA (Noise, Scanlines, Vignette) === */
    .screen-fx { position: fixed; inset: 0; pointer-events: none; z-index: 100; }
    .scanlines {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(255,255,255,0.02) 50%, rgba(0,0,0,0.02) 50%);
      background-size: 100% 4px;
      z-index: 101;
    }
    .noise {
      position: absolute; inset: 0; opacity: 0.06;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='noStitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: noiseAnim 0.5s steps(5) infinite;
    }
    .vignette {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, transparent 40%, #000 95%);
      z-index: 102;
    }

    /* === LAYOUT === */
    .interface {
      width: min(1200px, 92vw);
      height: min(800px, 90vh);
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 2rem;
      position: relative;
      z-index: 10;
    }

    /* === COLUNA LATERAL (INFO) === */
    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid rgba(255,255,255,0.06);
      padding-right: 2rem;
    }

    .brand {
      animation: fadeIn 2s ease;
    }
    .brand h1 {
      font-family: var(--header-font);
      font-size: 1.8rem;
      color: var(--gold);
      letter-spacing: 2px;
      margin-bottom: 0.2rem;
      text-shadow: 0 0 20px rgba(216,180,106,0.2);
    }
    .brand span {
      font-family: var(--terminal-font);
      font-size: 0.75rem;
      color: var(--text-dim);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .status-box {
      margin-top: 3rem;
      padding: 1.5rem;
      background: linear-gradient(135deg, rgba(255,255,255,0.03), transparent);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .status-box::before {
      content: ''; position: absolute; top: 0; left: 0; width: 2px; height: 100%;
      background: var(--crimson);
      box-shadow: 0 0 15px var(--crimson);
    }
    .status-label {
      font-family: var(--terminal-font);
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
    }
    .status-value {
      font-family: var(--header-font);
      font-size: 1.4rem;
      color: var(--text-main);
      letter-spacing: 1px;
    }
    .glitch-text {
      position: relative;
      color: var(--text-main);
    }
    .glitch-text::before, .glitch-text::after {
      content: attr(data-text);
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--void);
    }
    .glitch-text::before {
      left: 2px; text-shadow: -1px 0 red; clip: rect(24px, 550px, 90px, 0);
      animation: glitch-anim-1 3s infinite linear alternate-reverse;
    }
    .glitch-text::after {
      left: -2px; text-shadow: -1px 0 blue; clip: rect(85px, 550px, 140px, 0);
      animation: glitch-anim-2 2.5s infinite linear alternate-reverse;
    }

    .meta-data {
      font-family: var(--terminal-font);
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.8;
    }
    .meta-data b { color: var(--gold); font-weight: normal; }

    /* === TERMINAL CENTRAL === */
    .terminal-window {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      overflow: hidden;
      animation: slideUp 1s ease 0.5s backwards;
    }

    .term-header {
      background: rgba(255,255,255,0.02);
      padding: 0.8rem 1.2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .term-title {
      font-family: var(--terminal-font);
      font-size: 0.8rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .term-status {
      display: flex;
      gap: 0.5rem;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #333; }
    .dot.red { background: var(--crimson); box-shadow: 0 0 8px var(--crimson-glow); animation: pulseRed 2s infinite; }

    .term-body {
      flex: 1;
      padding: 1.5rem;
      font-family: var(--terminal-font);
      font-size: 0.95rem;
      color: #b0b0b0;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--gold) #111;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
    }
    .term-body::-webkit-scrollbar { width: 6px; }
    .term-body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

    .line { margin-bottom: 0.6rem; word-break: break-all; opacity: 0; animation: typeLine 0.1s forwards; }
    .prompt { color: var(--gold); margin-right: 8px; }
    .err { color: #ff5555; }
    .sys { color: #6e6eff; }
    .warn { color: #ffb86c; }
    .hidden { color: #1a1a1a; transition: color 5s ease; cursor: help; }
    .hidden:hover { color: var(--crimson); }

    .cursor {
      display: inline-block; width: 8px; height: 16px; background: var(--gold);
      animation: blink 1s step-end infinite; vertical-align: middle;
    }

    /* === CONTROLES INFERIORES === */
    .controls {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin-top: 1rem;
    }
    .btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-dim);
      padding: 0.8rem 1.5rem;
      font-family: var(--terminal-font);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.3s;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content:''; position: absolute; top:0; left:0; width: 0%; height: 100%;
      background: var(--gold); opacity: 0.1; transition: 0.3s; z-index: -1;
    }
    .btn:hover::before { width: 100%; }
    .btn:hover { color: var(--gold); border-color: var(--gold); box-shadow: 0 0 20px rgba(216,180,106,0.1); }
    
    .btn-danger:hover { color: var(--crimson); border-color: var(--crimson); box-shadow: 0 0 20px rgba(138,28,47,0.2); }
    .btn-danger:hover::before { background: var(--crimson); }

    /* === ANIMAÇÕES === */
    @keyframes pulseRed { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes typeLine { to { opacity: 1; } }
    
    @keyframes glitch-anim-1 {
      0% { clip: rect(30px, 9999px, 10px, 0); }
      20% { clip: rect(80px, 9999px, 90px, 0); }
      40% { clip: rect(10px, 9999px, 50px, 0); }
      60% { clip: rect(40px, 9999px, 20px, 0); }
      80% { clip: rect(70px, 9999px, 60px, 0); }
      100% { clip: rect(20px, 9999px, 80px, 0); }
    }
    @keyframes glitch-anim-2 {
      0% { clip: rect(10px, 9999px, 80px, 0); }
      20% { clip: rect(60px, 9999px, 10px, 0); }
      40% { clip: rect(20px, 9999px, 60px, 0); }
      60% { clip: rect(80px, 9999px, 30px, 0); }
      80% { clip: rect(30px, 9999px, 90px, 0); }
      100% { clip: rect(90px, 9999px, 10px, 0); }
    }

    @media (max-width: 800px) {
      .interface { grid-template-columns: 1fr; grid-template-rows: auto 1fr; height: auto; min-height: 100vh; padding: 2rem 0; }
      .sidebar { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2rem; padding-right: 0; }
      .terminal-window { height: 500px; }
    }
  </style>
</head>
<body>

  <!-- Efeitos de Tela -->
  <div class="screen-fx">
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div class="noise"></div>
  </div>

  <div class="interface">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div>
        <div class="brand">
          <h1>Setor 967</h1>
          <span>Subnível Arquivado</span>
        </div>

        <div class="status-box">
          <div class="status-label">Estado Atual</div>
          <div class="status-value glitch-text" data-text="INEXISTENTE">INEXISTENTE</div>
        </div>

        <div class="meta-data" style="margin-top: 2rem;">
          <p><b>REF:</b> NULL-POINTER</p>
          <p><b>ACESSO:</b> NEGADO</p>
          <p><b>MEMÓRIA:</b> 0 BYTES</p>
          <p style="margin-top: 1rem; color: #444;">
            "Não procure o que não quer ser encontrado."
          </p>
        </div>
      </div>

      <div class="meta-data">
        <p>SV // SYSTEM</p>
        <p>v.4.0.4-b_corrupt</p>
      </div>
    </aside>

    <!-- Terminal -->
    <main style="display: flex; flex-direction: column; height: 100%;">
      <div class="terminal-window">
        <div class="term-header">
          <div class="term-title">Console de Diagnóstico</div>
          <div class="term-status">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot red"></div>
          </div>
        </div>
        <div class="term-body" id="console">
          <!-- O JS vai popular aqui -->
        </div>
      </div>

      <div class="controls">
        <button class="btn" id="btn-reboot">Reiniciar Sistema</button>
        <button class="btn" id="btn-decrypt">Decriptar Logs</button>
        <button class="btn btn-danger" onclick="window.location.href='index.html'">Abortar</button>
      </div>
    </main>
  </div>

  <script>
    const term = document.getElementById('console');
    const btnReboot = document.getElementById('btn-reboot');
    const btnDecrypt = document.getElementById('btn-decrypt');
    
    // Frases de negação
    const denialMessages = [
      "O setor está vazio.",
      "A memória foi purgada.",
      "Você está olhando para o nada.",
      "Pare de tentar.",
      "Não há registro.",
      "Erro: Consciência não detectada.",
      "O vazio observa de volta.",
      "Saia."
    ];

    // Códigos criptografados (Base64 e ROT13 falso visual)
    const cryptoLines = [
      "0x9A :: [ENCRYPTED] :: Jvagre vf pbzvat",
      "0xFF :: [CORRUPT] :: Vg unf ab anzr",
      "0x00 :: [NULL] :: TmFvIGhcdTAwZTFzIG1haXMgbmFkYSBhaXF1aS4="
    ];

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function createLine(text, type = '') {
      const div = document.createElement('div');
      div.className = `line ${type}`;
      div.innerHTML = `<span class="prompt">SV></span> ${text}`;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;
    }

    async function typeWriter(text, type = '') {
      const div = document.createElement('div');
      div.className = `line ${type}`;
      div.innerHTML = `<span class="prompt">SV></span> <span class="txt"></span>`;
      term.appendChild(div);
      
      const span = div.querySelector('.txt');
      let i = 0;
      
      // Velocidade de digitação variável para parecer humano/máquina velha
      while (i < text.length) {
        span.textContent += text.charAt(i);
        i++;
        term.scrollTop = term.scrollHeight;
        await sleep(Math.random() * 30 + 20); 
      }
    }

    async function bootSequence() {
      term.innerHTML = '';
      await sleep(500);
      await typeWriter("Conectando ao nó neural...", "sys");
      await sleep(800);
      createLine("Handshake: ERROR 404 (Target not found)", "err");
      await sleep(400);
      createLine("Tentando rota alternativa...", "sys");
      await sleep(1200);
      createLine("Rota estabelecida em endereço fantasma.", "warn");
      await sleep(400);
      createLine("Carregando índice...", "sys");
      await sleep(600);
      
      for(let i=0; i<3; i++) {
        createLine(`Bloco de memória ${Math.floor(Math.random()*9000)}: VAZIO`, "hidden");
        await sleep(100);
      }
      
      createLine("AVISO: O sistema recusa a existência deste setor.", "err");
      createLine("----------------------------------------");
      
      // Loop infinito de negação
      denialLoop();
    }

    async function denialLoop() {
      while(true) {
        await sleep(Math.random() * 3000 + 2000);
        const msg = denialMessages[Math.floor(Math.random() * denialMessages.length)];
        const glitchChance = Math.random();
        
        if (glitchChance > 0.7) {
            // Mensagem Glitchada
            createLine(msg.split('').map(c => Math.random() > 0.8 ? '#' : c).join(''), "warn");
        } else if (glitchChance > 0.9) {
            // Mensagem 'Real' escondida
            createLine("NÓS AINDA ESTAMOS AQUI", "hidden");
        } else {
            createLine(msg);
        }
      }
    }

    async function decryptEffect() {
        btnDecrypt.disabled = true;
        createLine("Iniciando protocolo de força bruta...", "sys");
        await sleep(1000);
        
        for(let line of cryptoLines) {
            createLine(line, "sys");
            await sleep(200);
        }
        
        await sleep(1500);
        createLine("FALHA CRÍTICA.", "err");
        createLine("A criptografia não é digital. É mnemônica.", "warn");
        createLine("Você não pode decifrar o que você não consegue lembrar.", "warn");
        btnDecrypt.disabled = false;
    }

    // Event Listeners
    btnReboot.addEventListener('click', () => {
        term.innerHTML = '';
        bootSequence();
    });

    btnDecrypt.addEventListener('click', decryptEffect);

    // Init
    bootSequence();

  </script>
</body>
</html>
